<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organic Scroll Reveal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fff; font-family: Georgia, serif; }

  /* ── Sticky scene: full viewport, holds circle ── */
  .scene {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  .circle-stage {
    position: relative;
    width: min(55vw, 55vh);
    height: min(55vw, 55vh);
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 8px 48px rgba(0,0,0,0.13);
  }

  .layer-base {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.2);
    font-size: 1.1rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  #revealCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* ── Scroll content: sits on top of sticky scene ── */
  .scroll-content {
    position: relative;
    z-index: 2;
    /* negative margin pulls this up so it overlaps the sticky scene */
    margin-top: -100vh;
    pointer-events: none;
  }

  /* Each block is one full viewport tall */
  /* The sentence is pinned to the bottom of each block */
  .block {
    height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .sentence {
    max-width: 460px;
    text-align: center;
    font-size: clamp(1rem, 2.5vw, 1.4rem);
    line-height: 1.7;
    color: #222;
    padding: 0 2rem 10vh;
    width: 100%;
  }

  /* Extra scroll room at the end */
  .end-spacer { height: 150vh; }

  .label {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    color: #aaa;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 0.4s;
    z-index: 10;
  }
</style>
</head>
<body>

  <!-- Sticky circle, always centered -->
  <div class="scene">
    <div class="circle-stage">
      <div class="layer-base">Image One</div>
      <canvas id="revealCanvas"></canvas>
    </div>
  </div>

  <!-- Scroll content overlaps the sticky scene -->
  <div class="scroll-content">
    <!-- Block 1: sentence 1 at bottom, drives reveal 1 as it scrolls up -->
    <div class="block">
      <p class="sentence" id="s1">This is the first sentence. It scrolls naturally beneath the circle and drives the first reveal.</p>
    </div>
    <!-- Block 2: sentence 2 at bottom, drives reveal 2 as it scrolls up -->
    <div class="block">
      <p class="sentence" id="s2">This is the second sentence. As it rises, the second image grows into view.</p>
    </div>
    <div class="end-spacer"></div>
  </div>

  <div class="label" id="label">↓ Scroll</div>

<script>
  const canvas = document.getElementById('revealCanvas');
  const ctx = canvas.getContext('2d');
  const label = document.getElementById('label');
  const s1 = document.getElementById('s1');
  const s2 = document.getElementById('s2');

  let W, H, cx, cy, animTime = 0;
  let prog1 = 0, prog2 = 0;

  const COLORS = [
    ['#f5af19', '#f12711', '#c0392b'],
    ['#43cea2', '#185a9d', '#6a3093'],
  ];

  function resize() {
    const stage = canvas.parentElement;
    W = canvas.width = stage.offsetWidth;
    H = canvas.height = stage.offsetHeight;
    cx = W / 2;
    cy = H / 2;
  }

  function noise(angle, t, seed = 0) {
    return (
      Math.sin(angle * 3  + t * 0.7  + seed) * 0.35 +
      Math.sin(angle * 7  - t * 1.1  + seed) * 0.28 +
      Math.sin(angle * 12 + t * 0.9  + seed) * 0.18 +
      Math.sin(angle * 18 - t * 0.5  + seed) * 0.10 +
      Math.sin(angle * 25 + t * 1.5  + seed) * 0.05
    );
  }

  function drawBlob(prog, t, colors, seed) {
    if (prog <= 0) return;
    const maxR = Math.sqrt(cx * cx + cy * cy) * 1.05;
    const baseR = prog * maxR;
    const wobble = baseR * 0.30 * Math.sin(Math.PI * prog);

    ctx.save();
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const angle = (i / 200) * Math.PI * 2;
      const r = baseR + noise(angle, t, seed) * wobble;
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.clip();

    const scale = 1.15 - prog * 0.15;
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.translate(-cx, -cy);

    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0,   colors[0]);
    grad.addColorStop(0.5, colors[1]);
    grad.addColorStop(1,   colors[2]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function render() {
    animTime += 0.018;
    ctx.clearRect(0, 0, W, H);
    drawBlob(prog1, animTime,       COLORS[0], 0);
    drawBlob(prog2, animTime + 100, COLORS[1], 99);
    requestAnimationFrame(render);
  }

  // 0 when sentence is at bottom of viewport, 1 when sentence has fully scrolled off top
  function sentenceProgress(el) {
    const rect = el.getBoundingClientRect();
    const vh = window.innerHeight;
    // start: bottom of sentence reaches bottom of viewport
    // end: top of sentence reaches top of viewport
    const start = vh - rect.bottom + (vh + rect.height);
    const traveled = vh - rect.bottom;
    return Math.min(Math.max(traveled / (vh + rect.height), 0), 1);
  }

  function onScroll() {
    prog1 = sentenceProgress(s1);
    prog2 = sentenceProgress(s2);
    label.style.opacity = window.scrollY > 20 ? '0' : '1';
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', () => { resize(); onScroll(); });

  resize();
  onScroll();
  render();
</script>
</body>
</html>
