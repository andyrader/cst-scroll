<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CST About Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fff; font-family: Georgia, serif; }

  /* ── Hero: sticky circle lives here ── */
  .hero {
    position: relative;
    height: 300vh;
  }

  .scene {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    pointer-events: none;
  }

  /* Wrapper that fixes the circle in place independent of sticky scroll */
  .circle-fixed {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    pointer-events: none;
  }

  .circle-stage {
    position: relative;
    width: min(55vw, 55vh);
    height: min(55vw, 55vh);
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 8px 48px rgba(0,0,0,0.13);
  }

  .layer-base {
    position: absolute;
    inset: 0;
    background-image: url('about-1.png');
    background-size: cover;
    background-position: center;
    background-color: #1a1a2e;
  }

  #revealCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* Sentences scroll over the sticky circle */
  .scroll-content {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: url(nav.png) no-repeat 50% 0;
    background-size: contain;
  }

  /* Push sentences down so first appears below circle on load */
  .sentences-spacer { height: 50vh; }

  .block {
    height: 100vh;
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .sentence {
    text-align: center;
    font-size: clamp(1.875rem, 0.4787rem + 4.4681vw, 4.5rem);
    letter-spacing: -0.025em;
    line-height: 1;
    color: #1C1D1E;
    padding: 0 2rem 10vh;
    width: 100%;
    font-family: sans-serif;
    font-weight: bold;
  }

 .words {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    pointer-events: none;
    font-family: monospace;
    font-size: 10px;
    font-weight: bold;
    color: #222;
    font-size: 1em;
    text-transform: uppercase;
  }
  
  .words-left  { left: 20px; text-align: right; }
  .words-right { right: 20px; text-align: left; }

  /* ── Next section ── */
  .next-section {
    position: relative;
    z-index: 3;
    min-height: 424vw;
    display: flex;
    align-items: center;
    justify-content: center;
    background: url(about-content.png) no-repeat 50% 0;
    background-size: contain;
  }

  .label {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    color: #999;
    font-family: sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 0.4s;
    z-index: 10;
  }
</style>
</head>
<body>

  <div class="hero" id="hero">
    <div class="circle-fixed">
      <div class="circle-stage" id="circleStage">
        <div class="layer-base"></div>
        <canvas id="revealCanvas"></canvas>
      </div>
    </div>

    <div class="scroll-content">
      <div class="block">
        <p class="sentence" id="s1">Doing good science is important.</p>
      </div>
      <div class="block">
        <p class="sentence" id="s2">So is just doing good.</p>
      </div>
    </div>
  </div>
 <div class="words words-left" id="wordsLeft">
    Quality since 1999
  </div>
  
  <div class="words words-right" id="wordsRight">
    Over $XM donated
  </div>

  <div class="next-section">
  </div>

  <div class="label" id="label">↓ Scroll</div>

<script>
  const canvas = document.getElementById('revealCanvas');
  const ctx = canvas.getContext('2d');
  const label = document.getElementById('label');
  const s1 = document.getElementById('s1');
  const s2 = document.getElementById('s2');
  const circleStage = document.getElementById('circleStage');
  const hero = document.getElementById('hero');
  const wordsLeft  = document.getElementById('wordsLeft');
  const wordsRight = document.getElementById('wordsRight');
  let W, H, cx, cy;
  let prog1 = 0, prog2 = 0;

  const img1 = new Image(); img1.src = 'about-2.png';
  const img2 = new Image(); img2.src = 'about-3.png';

  const maskCanvas  = document.createElement('canvas');
  const mCtx = maskCanvas.getContext('2d');
  const blobCanvas  = document.createElement('canvas');
  const bCtx = blobCanvas.getContext('2d');

  function resize() {
    const stage = canvas.parentElement;
    W = canvas.width  = maskCanvas.width  = blobCanvas.width  = stage.offsetWidth;
    H = canvas.height = maskCanvas.height = blobCanvas.height = stage.offsetHeight;
    cx = W / 2; cy = H / 2;
  }

  function hashNoise(x, y, seed) {
    const n = Math.sin(x * 127.1 + y * 311.7 + seed * 74.3) * 43758.5453;
    return n - Math.floor(n);
  }

  function buildNoiseMask(prog, seed) {
    const maxR = Math.sqrt(cx * cx + cy * cy) * 1.05;
    const baseR = prog * maxR;
    const band  = 20 + prog * 30;
    const inner = baseR - band;
    const outer = baseR + band;
    const imageData = mCtx.createImageData(W, H);
    const d = imageData.data;
    for (let py = 0; py < H; py++) {
      for (let px = 0; px < W; px++) {
        const dx = px - cx, dy = py - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        let filled = false;
        if (dist < inner) {
          filled = true;
        } else if (dist < outer) {
          const n = hashNoise(px + seed * 13, py + seed * 7, seed);
          filled = n > (dist - inner) / (outer - inner);
        }
        if (filled) {
          const i = (py * W + px) * 4;
          d[i] = d[i+1] = d[i+2] = 255; d[i+3] = 255;
        }
      }
    }
    mCtx.putImageData(imageData, 0, 0);
  }

  function drawBlob(prog, img, seed, scale) {
    if (prog <= 0 || !img.complete || !img.naturalWidth) return;
    buildNoiseMask(prog, seed);
    bCtx.clearRect(0, 0, W, H);
    bCtx.save();
    bCtx.translate(cx, cy); bCtx.scale(scale, scale); bCtx.translate(-cx, -cy);
    bCtx.drawImage(img, 0, 0, W, H);
    bCtx.restore();
    bCtx.globalCompositeOperation = 'destination-in';
    bCtx.drawImage(maskCanvas, 0, 0);
    bCtx.globalCompositeOperation = 'source-over';
    ctx.drawImage(blobCanvas, 0, 0);
  }

  function render() {
    const globalScale = 1.15 - ((prog1 + prog2) / 2) * 0.15;
    ctx.clearRect(0, 0, W, H);
    drawBlob(prog1, img1, 0,  globalScale);
    drawBlob(prog2, img2, 99, globalScale);
    requestAnimationFrame(render);
  }

  function sentenceProgress(el) {
    const rect = el.getBoundingClientRect();
    const vh = window.innerHeight;
    return Math.min(Math.max((vh - rect.bottom) / (vh + rect.height), 0), 1);
  }

  function onScroll() {
    prog1 = sentenceProgress(s1);
    prog2 = sentenceProgress(s2);
    label.style.opacity = window.scrollY > 20 ? '0' : '1';

    // Fade: starts when hero bottom enters viewport, completes over 40vh of scroll
    const heroBottom = hero.getBoundingClientRect().bottom;
    const vh = window.innerHeight;
    const fadeProgress = Math.min(Math.max((vh - heroBottom) / (vh * 0.4), 0), 1);
    circleStage.style.opacity = 1 - fadeProgress;
    circleStage.style.filter  = `blur(${fadeProgress * 14}px)`;
    wordsLeft.style.opacity    = 1 - fadeProgress;
    wordsRight.style.opacity   = 1 - fadeProgress;
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', () => { resize(); onScroll(); });

  resize();
  onScroll();
  render();
</script>
</body>
</html>
