<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organic Scroll Reveal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fff; font-family: Georgia, serif; }

  .scene {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  .circle-stage {
    position: relative;
    width: min(55vw, 55vh);
    height: min(55vw, 55vh);
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 8px 48px rgba(0,0,0,0.13);
  }

  .layer-base {
    position: absolute;
    inset: 0;
    background-image: url('about-1.png');
    background-size: cover;
    background-position: center;
  }

  #revealCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  .scroll-content {
    position: relative;
    z-index: 2;
    margin-top: -100vh;
    pointer-events: none;
  }

  .block {
    height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .sentence {
    text-align: center;
    font-size: clamp(2rem, 72px, 4.5rem);
    letter-spacing: -0.025em;
    line-height: 1;
    color: #1C1D1E;
    padding: 0 2rem 10vh;
    width: 100%;
    font-family: sans-serif;
    font-weight: bold;
  }

  .end-spacer { height: 150vh; }

  .label {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    color: #aaa;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 0.4s;
    z-index: 10;
  }
</style>
</head>
<body>

  <div class="scene">
    <div class="circle-stage">
      <div class="layer-base"></div>
      <canvas id="revealCanvas"></canvas>
    </div>
  </div>

  <div class="scroll-content">
    <div class="block">
      <p class="sentence" id="s1">This is the first sentence. It scrolls naturally beneath the circle and drives the first reveal.</p>
    </div>
    <div class="block">
      <p class="sentence" id="s2">This is the second sentence. As it rises, the second image grows into view.</p>
    </div>
    <div class="end-spacer"></div>
  </div>

  <div class="label" id="label">↓ Scroll</div>

<script>
  const canvas = document.getElementById('revealCanvas');
  const ctx = canvas.getContext('2d');
  const label = document.getElementById('label');
  const s1 = document.getElementById('s1');
  const s2 = document.getElementById('s2');

  // Low-res pixel grid size — bigger = chunkier pixels
  const PIXEL = 1;
  let W, H, cx, cy, PW, PH, animTime = 0;
  let prog1 = 0, prog2 = 0;

  const img1 = new Image(); img1.src = 'about-2.png';
  const img2 = new Image(); img2.src = 'about-3.png';

  function resize() {
    const stage = canvas.parentElement;
    W = stage.offsetWidth;
    H = stage.offsetHeight;
    // Draw at low res, CSS stretches it (pixelated rendering)
    PW = Math.ceil(W / PIXEL);
    PH = Math.ceil(H / PIXEL);
    canvas.width  = PW;
    canvas.height = PH;
    cx = PW / 2;
    cy = PH / 2;
  }

  // Simple hash noise — deterministic per pixel + time bucket
  function hashNoise(x, y, t) {
    const tx = Math.floor(t);
    const n = Math.sin(x * 127.1 + y * 311.7 + tx * 74.3) * 43758.5453;
    return n - Math.floor(n);
  }

  function drawPixelBlob(prog, t, colors, seed) {
    if (prog <= 0) return;

    const maxR = Math.sqrt(cx * cx + cy * cy) * 1.05;
    const baseR = prog * maxR;
    // Edge noise band width (in pixel-grid units)
    const band = 20 + prog * 30;

    // Make a color gradient function across the canvas
    const [c0, c1, c2] = colors.map(hexToRgb);

    for (let py = 0; py < PH; py++) {
      for (let px = 0; px < PW; px++) {
        const dx = px - cx, dy = py - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);

        // In the edge band, use noise to decide filled or not
        const inner = baseR - band;
        const outer = baseR + band;

        let filled = false;
        if (dist < inner) {
          filled = true;
        } else if (dist < outer) {
          const n = hashNoise(px + seed, py + seed * 1.3, 0);
          const threshold = (dist - inner) / (outer - inner);
          filled = n > threshold;
        }

        if (filled) {
          // Gradient colour based on position
          const gx = px / PW, gy = py / PH;
          const mix = gx * 0.5 + gy * 0.5;
          const [r, g, b] = lerpColor(mix < 0.5
            ? [c0, c1, mix * 2]
            : [c1, c2, (mix - 0.5) * 2]);

          // Zoom: sample from slightly inward
          const scale = 1.15 - prog * 0.15;
          const sx = Math.round(cx + (px - cx) / scale);
          const sy = Math.round(cy + (py - cy) / scale);
          const [fr, fg, fb] = (sx >= 0 && sx < PW && sy >= 0 && sy < PH)
            ? lerpColor([c0, c2, (sx / PW * 0.5 + sy / PH * 0.5)])
            : [r, g, b];

          ctx.fillStyle = `rgb(${fr},${fg},${fb})`;
          ctx.fillRect(px, py, 1, 1);
        }
      }
    }
  }

  function render() {
    animTime += 0.18;
    ctx.clearRect(0, 0, PW, PH);
    drawPixelBlob(prog1, animTime,      COLORS[0], 0);
    drawPixelBlob(prog2, animTime + 50, COLORS[1], 99);
    requestAnimationFrame(render);
  }

  function sentenceProgress(el) {
    const rect = el.getBoundingClientRect();
    const vh = window.innerHeight;
    const traveled = vh - rect.bottom;
    return Math.min(Math.max(traveled / (vh + rect.height), 0), 1);
  }

  function onScroll() {
    prog1 = sentenceProgress(s1);
    prog2 = sentenceProgress(s2);
    label.style.opacity = window.scrollY > 20 ? '0' : '1';
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', () => { resize(); onScroll(); });

  resize();
  onScroll();
  render();
</script>
</body>
</html>
