<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organic Scroll Reveal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fff; font-family: Georgia, serif; }

  .scene {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  .circle-stage {
    position: relative;
    width: min(55vw, 55vh);
    height: min(55vw, 55vh);
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 8px 48px rgba(0,0,0,0.13);
  }

  .layer-base {
    position: absolute;
    inset: 0;
    background-image: url('about-1.png');
    background-size: cover;
    background-position: center;
    background-color: #1a1a2e;
  }

  #revealCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .scroll-content {
    position: relative;
    z-index: 2;
    margin-top: -100vh;
    pointer-events: none;
  }

  .block {
    height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .sentence {
    text-align: center;
    font-size: clamp(2rem, 72px, 4.5rem);
    letter-spacing: -0.025em;
    line-height: 1;
    color: #1C1D1E;
    padding: 0 2rem 10vh;
    width: 100%;
   font-family: sans-serif;
   font-weight: bold;
  }

  .end-spacer { height: 150vh; }

  .label {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    color: #aaa;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 0.4s;
    z-index: 10;
  }
</style>
</head>
<body>

  <div class="scene">
    <div class="circle-stage">
      <div class="layer-base"></div>
      <canvas id="revealCanvas"></canvas>
    </div>
  </div>

  <div class="scroll-content">
    <div class="block">
      <p class="sentence" id="s1">Doing good science is important.</p>
    </div>
    <div class="block">
      <p class="sentence" id="s2">So is just doing good.</p>
    </div>
    <div class="end-spacer"></div>
  </div>

  <div class="label" id="label">↓ Scroll</div>

<script>
  const canvas = document.getElementById('revealCanvas');
  const ctx = canvas.getContext('2d');
  const label = document.getElementById('label');
  const s1 = document.getElementById('s1');
  const s2 = document.getElementById('s2');

  let W, H, cx, cy, animTime = 0;
  let prog1 = 0, prog2 = 0;

  const img1 = new Image(); img1.src = 'about-2.png';
  const img2 = new Image(); img2.src = 'about-3.png';

  // Offscreen canvases — one mask, one per blob
  const maskCanvas = document.createElement('canvas');
  const mCtx = maskCanvas.getContext('2d');
  const blobCanvas = document.createElement('canvas');
  const bCtx = blobCanvas.getContext('2d');

  function resize() {
    const stage = canvas.parentElement;
    W = canvas.width = maskCanvas.width = blobCanvas.width = stage.offsetWidth;
    H = canvas.height = maskCanvas.height = blobCanvas.height = stage.offsetHeight;
    cx = W / 2;
    cy = H / 2;
  }

  function hashNoise(x, y, seed) {
    const n = Math.sin(x * 127.1 + y * 311.7 + seed * 74.3) * 43758.5453;
    return n - Math.floor(n);
  }

  // Build a mask on the offscreen canvas using pixel noise at the edge
  function buildNoiseMask(prog, seed) {
    const maxR = Math.sqrt(cx * cx + cy * cy) * 1.05;
    const baseR = prog * maxR;
    const band  = 20 + prog * 30;
    const inner = baseR - band;
    const outer = baseR + band;

    const imageData = mCtx.createImageData(W, H);
    const d = imageData.data;

    for (let py = 0; py < H; py++) {
      for (let px = 0; px < W; px++) {
        const dx = px - cx, dy = py - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);

        let filled = false;
        if (dist < inner) {
          filled = true;
        } else if (dist < outer) {
          const n = hashNoise(px + seed * 13, py + seed * 7, seed);
          filled = n > (dist - inner) / (outer - inner);
        }

        if (filled) {
          const i = (py * W + px) * 4;
          d[i] = d[i+1] = d[i+2] = 255;
          d[i+3] = 255;
        }
      }
    }
    mCtx.putImageData(imageData, 0, 0);
  }

  function drawBlob(prog, img, seed) {
    if (prog <= 0 || !img.complete || !img.naturalWidth) return;

    // 1. Build noise mask on maskCanvas
    buildNoiseMask(prog, seed);

    // 2. Draw image (with zoom) onto blobCanvas
    bCtx.clearRect(0, 0, W, H);
    bCtx.save();
    const scale = 1.15 - prog * 0.15;
    bCtx.translate(cx, cy);
    bCtx.scale(scale, scale);
    bCtx.translate(-cx, -cy);
    bCtx.drawImage(img, 0, 0, W, H);
    bCtx.restore();

    // 3. Clip blobCanvas to the mask using destination-in
    bCtx.globalCompositeOperation = 'destination-in';
    bCtx.drawImage(maskCanvas, 0, 0);
    bCtx.globalCompositeOperation = 'source-over';

    // 4. Draw clipped blob onto main canvas
    ctx.drawImage(blobCanvas, 0, 0);
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawBlob(prog1, img1, 0);
    drawBlob(prog2, img2, 99);
    requestAnimationFrame(render);
  }

  function sentenceProgress(el) {
    const rect = el.getBoundingClientRect();
    const vh = window.innerHeight;
    const traveled = vh - rect.bottom;
    return Math.min(Math.max(traveled / (vh + rect.height), 0), 1);
  }

  function onScroll() {
    prog1 = sentenceProgress(s1);
    prog2 = sentenceProgress(s2);
    label.style.opacity = window.scrollY > 20 ? '0' : '1';
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', () => { resize(); onScroll(); });

  resize();
  onScroll();
  render();
</script>
</body>
</html>
